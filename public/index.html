<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Stockroom</h1>
    <button class="btn primary" id="addBtn">Add product</button>
  </header>

  <main>
    <section class="stats" aria-label="Summary">
      <div class="stat"><span class="stat-label">Products</span><strong id="sProducts">–</strong></div>
      <div class="stat"><span class="stat-label">Units in stock</span><strong id="sUnits">–</strong></div>
      <div class="stat"><span class="stat-label">Inventory value</span><strong id="sValue">–</strong></div>
      <div class="stat warn"><span class="stat-label" id="sLowLabel">Low stock</span><strong id="sLow">–</strong></div>
    </section>

    <section class="panel split">
      <div class="products">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search name or SKU" aria-label="Search products">
          <select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Product</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th><span class="sr">Actions</span></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="empty" id="empty" hidden>No products match. Clear the filters or add a new product.</p>
      </div>

      <aside class="categories">
        <h2>Units by category</h2>
        <ul id="catBars"></ul>
      </aside>
    </section>
  </main>

  <dialog id="formDialog">
    <form id="form" method="dialog" novalidate>
      <h2 id="formTitle">Add product</h2>
      <label>Name <input name="name" required maxlength="120"></label>
      <div class="grid2">
        <label>SKU <input name="sku" required maxlength="40"></label>
        <label>Category <input name="category" list="catList" placeholder="General"></label>
      </div>
      <datalist id="catList"></datalist>
      <div class="grid2">
        <label>Price <input name="price" type="number" min="0" step="0.01" required></label>
        <label>Stock <input name="stock" type="number" min="0" step="1" required></label>
      </div>
      <p class="form-error" id="formError" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save product</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteDialog">
    <h2>Delete product?</h2>
    <p id="deleteText"></p>
    <div class="actions">
      <button class="btn" id="deleteCancel">Keep product</button>
      <button class="btn danger" id="deleteConfirm">Delete product</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
